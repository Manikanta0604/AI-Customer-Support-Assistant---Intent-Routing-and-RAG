services:
  qdrant:
    image: qdrant/qdrant:v1.12.6
    ports:
      - "6333:6333"
    volumes:
      - qdrant_data:/qdrant/storage

  backend:
    build: ./backend
    env_file: ./backend/.env
    environment:
      QDRANT_URL: http://qdrant:6333
      DATABASE_PATH: /data/support.db
      STARTER_KNOWLEDGE_PATH: /knowledge-base/starter-faq.md
    volumes:
      - support_data:/data
      - ./knowledge-base:/knowledge-base:ro
    ports:
      - "8000:8000"
    depends_on:
      - qdrant

  frontend:
    build:
      context: ./frontend
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:8000}
    environment:
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:8000}
    ports:
      - "3000:3000"
    depends_on:
      - backend

volumes:
  qdrant_data:
  support_data:
